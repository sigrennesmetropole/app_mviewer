<!-- Copie du composant de recherche de mviewer defini dans mviewer-v4/index.html ligne 91 -->
<!-- On est obligé de le recopier car le composant de recherche de mviewer est supprimé du DOM si aucune recheche n'est spécifiée dans la config -->
<!--  Attention, très sensible aux migrations de mviewer -->
<div class="navbar-form" role="search" id="searchtool">
  <div class="form-group input-group">
    <input
      type="text"
      class="form-control"
      placeholder="Rechercher"
      i18n="navbar.search.placeholder"
      id="searchfieldRM"
    />
    <button
      type="button"
      class="btn btn-light"
      aria-label="Open search options"
      data-bs-toggle="modal"
      data-bs-target="#parameterspanel"
      i18n="search.panel.title"
      title="Paramètres de recherche"
    >
      <i class="ri-more-2-fill"></i>
    </button>
  </div>
</div>

<div
  id="parcelSelectors"
  class="parcelSelectors"
  tabindex="1"
  style="display: none"
>
  <p id="parcelSelectorsLegend">Recherche par parcelle :</p>
  <div class="parcelSelectorsRow">
    <select
      id="communeSearch"
      name="communeSearch"
      class="form-control"
    ></select>
    <select id="section" class="sectionsList form-control"></select>
    <select id="parcelle" class="parcellesList form-control" disabled></select>
  </div>
</div>
